name: PIE test suite

# Fast tiers (unit + contract + integration, target < 5 min total) on
# every push/PR -- e2e (the full scheduler.py sweep, ~5-6 min PER
# composition, ~1.5-2 h for the full 18-composition sweep -- see
# testsys/README.md "Runtimes") is opt-in only: workflow_dispatch or a
# weekly schedule, never push/PR. That split mirrors this project's own
# EQdyna/eqquasi sibling projects' CI (fast gate on every push, slow
# physics sweep on a timer), scaled down for a serial-Python, no-MPI,
# no-build codebase.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 * * 1'  # weekly, Monday 07:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    # unit + contract + integration (incl. parity against the committed
    # Zenodo/self-generated references). Runs on every push and PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r testsys/requirements.txt

      - name: Run fast tiers (unit, contract, integration)
        env:
          PYTHONNOUSERSITE: '1'
          MPLBACKEND: 'Agg'
        run: python3 testsys/run.py unit contract integration

  e2e:
    # Full scheduler.py-shaped sweep against the committed self-golden.
    # Opt-in only (see the `on:` block above) -- NOT part of the push/PR
    # gate.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r testsys/requirements.txt

      - name: Run e2e tier
        env:
          PYTHONNOUSERSITE: '1'
          MPLBACKEND: 'Agg'
        run: python3 testsys/run.py e2e
