[pytest]
testpaths = testsys
markers =
    unit: pure-function tests, milliseconds, no file I/O, no model solve
    contract: file/schema/CLI/CI conventions -- no physics solve
    integration: a handful of real present-day model solves, incl. parity
        against externally-published (Zenodo) or historical (v1.0.3/v1.0.4)
        reference output; seconds each
    e2e: full scheduler.py sweep against a committed golden reference;
        minutes, opt-in (workflow_dispatch/schedule in CI, not push/PR)
    parity: subset of integration that compares against an oracle this repo
        did not generate (published paper data or a pre-fix historical code)
    published_wide: samples hundreds of cases directly from
        ~/shared_dataset/zenodo.16459292/ (never copied); skipped with a
        clear reason when that path is absent (e.g. CI)
addopts = -m "not e2e" -ra -p pielib
pythonpath = .
